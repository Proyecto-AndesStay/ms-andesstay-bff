server.port=8080
spring.application.name=ms-andesstay-bff

# Dirección del microservicio de reservas de dominio
reservations.service.url=http://localhost:8081/api/reservations

# Validación del token JWT de Azure AD (Requerido en EP1 y Caso AndesStay)
# Si aún no tienes a mano tu TENANT_ID, déjalo así o reemplázalo con el de tu App Registration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/common/v2.0